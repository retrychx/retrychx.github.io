<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>moved → migoric</title>
<meta name="robots" content="noindex">
<style>
  :root{--paper:#F6F4F0;--ink:#151412;--muted:#6B6660;--rule:#E2DED7;--accent:#DD4C4F}
  @media (prefers-color-scheme: dark){
    :root{--paper:#151412;--ink:#EDE8E0;--muted:#8A857C;--rule:#2A2724;--accent:#DD4C4F}
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--paper);color:var(--ink);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:32px;
    -webkit-font-smoothing:antialiased;
  }
  main{max-width:520px}
  .tag{
    font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 18px;
  }
  h1{font-size:27px;line-height:1.28;letter-spacing:-.02em;margin:0 0 14px}
  p{margin:0 0 12px;color:var(--muted)}
  code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;
    background:rgba(128,128,128,.13);padding:2px 6px;border-radius:5px;color:var(--ink);
  }
  a{color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor}
  .rule{height:1px;background:var(--rule);margin:22px 0}
  .fine{font-size:14px}
</style>
</head>
<body>
  <main>
    <p class="tag">moved</p>
    <h1>This handle is retired.</h1>
    <p>The account formerly at <code>retrychx</code> is now <code>migoric</code>.</p>
    <p id="link-target"><a href="https://migoric.github.io/blog/">Continue to the blog &rarr;</a></p>
    <p class="fine" id="note">If nothing happens, the link above still works.</p>
    <div class="rule"></div>
    <p class="fine">Old <code>retrychx.github.io/blog/&hellip;</code> URLs now live under
      <code>migoric.github.io/blog/&hellip;</code> &mdash; same content, new host.</p>
  </main>
  <script>
    // GitHub Pages serves this file (404.html) for any path that has no file on
    // disk, and the requested pathname is still available here.
    //
    // Two things shape the mapping:
    //   1. The old site never actually deployed — this repo's Actions history
    //      holds only the two runs from the day the new site went live — so no
    //      deep link to retrychx.github.io/blog/<post> was ever live. The
    //      mapping below is therefore a best-effort courtesy, not a guarantee.
    //   2. The new site nests posts one level deeper: it serves /blog/writing/
    //      <slug>/ where the old layout would have served /blog/<slug>/. A
    //      verbatim path copy would land every old post URL on the new 404.
    //
    // So: keep paths that exist verbatim, try the nested form for bare slugs,
    // and send anything else to the blog index rather than the site root.
    (function () {
      var path = location.pathname;
      var tail = location.search + location.hash;
      var BLOG = '/blog/';
      // Paths that exist verbatim on the new site.
      var VERBATIM = ['/blog/', '/blog/about/', '/blog/writing/'];
      var target;

      if (path.indexOf(BLOG) === 0) {
        var rest = path.slice(BLOG.length);
        var verbatim = VERBATIM.indexOf(path) !== -1
                    || rest.indexOf('writing/') === 0
                    || /\.(xml|json|txt)$/.test(rest);
        target = 'https://migoric.github.io/blog/' + (verbatim ? rest : 'writing/' + rest);
      } else {
        target = 'https://migoric.github.io/blog/';
      }
      target += tail;

      var a = document.querySelector('#link-target a');
      if (a) a.href = target;
      var note = document.getElementById('note');
      if (note) note.hidden = true;
      location.replace(target);
    })();
  </script>
</body>
</html>
